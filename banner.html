<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crystal: Match 3 Puzzle Banner</title>
  <style>
    :root {
      --ink: #17324a;
      --sky-top: #7ed3ff;
      --sky-bottom: #d8f4ff;
      --sun: #ffe29a;
      --line: rgba(255, 255, 255, .7);
      --shadow: 0 16px 40px rgba(28, 68, 92, .22);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1024px; height: 500px; overflow: hidden; }
    body {
      font-family: "Avenir Next", "Trebuchet MS", "Segoe UI", sans-serif;
      color: #fff;
      background:
        radial-gradient(circle at 12% 16%, var(--sun) 0, rgba(255,226,154,.9) 10%, rgba(255,226,154,0) 22%),
        linear-gradient(180deg, var(--sky-top) 0%, #8ed6ff 26%, #9ddeff 55%, var(--sky-bottom) 100%);
      position: relative;
    }

    .cloud,
    .cloud::before,
    .cloud::after {
      position: absolute;
      background: rgba(255, 255, 255, .9);
      border-radius: 999px;
      content: "";
    }

    .cloud {
      width: 180px;
      height: 38px;
      top: 72px;
      right: 116px;
      filter: blur(.2px);
    }

    .cloud::before {
      width: 74px;
      height: 58px;
      left: 28px;
      top: -24px;
    }

    .cloud::after {
      width: 88px;
      height: 46px;
      right: 22px;
      top: -16px;
    }

    .ground {
      position: absolute;
      left: 0;
      right: 0;
      bottom: -20px;
      height: 150px;
      background:
        radial-gradient(circle at 18% 28%, rgba(122, 194, 84, .85) 0 22%, rgba(122,194,84,0) 23%),
        radial-gradient(circle at 80% 30%, rgba(126, 202, 92, .78) 0 24%, rgba(126,202,92,0) 25%),
        linear-gradient(180deg, rgba(150, 204, 99, .0) 0%, rgba(119, 177, 73, .35) 8%, #75ab48 100%);
    }

    .grass-left,
    .grass-right {
      position: absolute;
      bottom: 62px;
      width: 160px;
      height: 220px;
      background: linear-gradient(180deg, #7acb4a 0%, #4f8f2d 100%);
      clip-path: polygon(48% 0, 61% 16%, 54% 22%, 74% 44%, 63% 47%, 85% 82%, 59% 59%, 49% 100%, 43% 60%, 27% 80%, 36% 46%, 18% 42%, 34% 22%, 26% 15%);
      opacity: .9;
      filter: drop-shadow(0 12px 18px rgba(50, 105, 34, .25));
    }

    .grass-left { left: -18px; transform: rotate(-6deg); }
    .grass-right { right: -8px; transform: scaleX(-1) rotate(-2deg); }

    .layout {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: 1.08fr .92fr;
      gap: 22px;
      width: 100%;
      height: 100%;
      padding: 40px 44px 34px 46px;
    }

    .copy {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding-bottom: 10px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 18px;
    }

    .brand img {
      width: 74px;
      height: 74px;
      border-radius: 18px;
      box-shadow: 0 12px 24px rgba(22, 54, 72, .22);
    }

    .brand span {
      font-size: 18px;
      line-height: 1.2;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, .92);
    }

    h1 {
      margin: 0;
      max-width: 470px;
      font-size: 56px;
      line-height: .98;
      letter-spacing: -.04em;
      text-shadow: 0 4px 18px rgba(22, 54, 72, .14);
    }

    .subtitle {
      margin: 18px 0 0;
      max-width: 455px;
      font-size: 22px;
      line-height: 1.35;
      color: rgba(255, 255, 255, .95);
      text-shadow: 0 3px 14px rgba(22, 54, 72, .12);
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 24px;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 42px;
      padding: 0 16px;
      border-radius: 999px;
      background: rgba(18, 54, 81, .22);
      border: 1px solid rgba(255, 255, 255, .38);
      backdrop-filter: blur(5px);
      font-size: 18px;
      font-weight: 700;
      color: #fff;
    }

    .chip img {
      width: 24px;
      height: 24px;
      object-fit: contain;
    }

    .phone-wrap {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .phone-wrap::before {
      content: "";
      position: absolute;
      width: 410px;
      height: 410px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,.38) 0%, rgba(255,255,255,.18) 36%, rgba(255,255,255,0) 70%);
      transform: translate(16px, 8px);
    }

    .phone {
      position: relative;
      width: 272px;
      height: 466px;
      border-radius: 32px;
      padding: 13px;
      background: linear-gradient(180deg, #f7fbff 0%, #d2e3f2 100%);
      box-shadow: var(--shadow);
      transform: rotate(7deg) translateY(10px);
    }

    .phone::before {
      content: "";
      position: absolute;
      top: 10px;
      left: 50%;
      width: 92px;
      height: 18px;
      border-radius: 999px;
      background: rgba(14, 43, 64, .86);
      transform: translateX(-50%);
      z-index: 3;
    }

    .screen {
      width: 100%;
      height: 100%;
      border-radius: 24px;
      overflow: hidden;
      background: #d2efff;
    }

    .screen img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      display: block;
    }

    .sparkle {
      position: absolute;
      right: 198px;
      top: 84px;
      width: 98px;
      height: 98px;
      opacity: .85;
      transform: rotate(12deg);
      filter: drop-shadow(0 10px 14px rgba(255, 204, 82, .16));
    }

    .sparkle::before,
    .sparkle::after {
      position: absolute;
      content: "";
      background: rgba(255, 255, 255, .95);
      border-radius: 999px;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
    }

    .sparkle::before {
      width: 14px;
      height: 92px;
    }

    .sparkle::after {
      width: 92px;
      height: 14px;
    }

    .sparkle i,
    .sparkle b {
      position: absolute;
      inset: 0;
      display: block;
    }

    .sparkle i::before,
    .sparkle i::after,
    .sparkle b::before,
    .sparkle b::after {
      position: absolute;
      content: "";
      background: rgba(255, 255, 255, .88);
      border-radius: 999px;
      left: 50%;
      top: 50%;
      transform-origin: center;
    }

    .sparkle i::before,
    .sparkle i::after {
      width: 10px;
      height: 72px;
      transform: translate(-50%, -50%) rotate(45deg);
    }

    .sparkle b::before,
    .sparkle b::after {
      width: 10px;
      height: 72px;
      transform: translate(-50%, -50%) rotate(-45deg);
    }
  </style>
</head>
<body>
  <div class="cloud"></div>
  <div class="grass-left"></div>
  <div class="grass-right"></div>
  <div class="ground"></div>
  <main class="layout">
    <section class="copy">
      <div class="brand">
        <img src="assets/app-icon.png" alt="">
        <span>Crystal: Match 3 Puzzle</span>
      </div>
      <h1>Match crystals.<br>Clear each level.</h1>
      <p class="subtitle">Swap pieces, clear locked cells, and remove blue base layers with simple offline match-3 play.</p>
      <div class="chips">
        <div class="chip"><img src="assets/locked-cell.png" alt="">Locked cells</div>
        <div class="chip"><img src="assets/cover-layer.png" alt="">Blue base layers</div>
        <div class="chip"><img src="assets/special-bomb.png" alt="">Special clears</div>
      </div>
    </section>
    <section class="phone-wrap" aria-label="Gameplay preview">
      <div class="sparkle"><i></i><b></b></div>
      <div class="phone">
        <div class="screen">
          <img src="assets/level-7.jpg" alt="Gameplay screenshot">
        </div>
      </div>
    </section>
  </main>
</body>
</html>
